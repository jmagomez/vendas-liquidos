name: Atualiza dashboard de vendas ANP

on:
  schedule:
    # Duas passadas por mês. A ANP não fecha o mês anterior no dia 5: os agentes
    # ainda estão dentro do prazo de declaração, e o Liquidos_Vendas_Atual.csv
    # já lista o mês corrente com as poucas entregas antecipadas. A rodada do
    # dia 20 é a que costuma pegar o mês anterior consolidado; a do dia 5 pega
    # revisões e serve de rede se a do dia 20 falhar.
    - cron: "0 12 5 * *"    # dia 5, 12:00 UTC (9h em Brasília)
    - cron: "0 12 20 * *"   # dia 20, 12:00 UTC
  workflow_dispatch: {}     # permite rodar manualmente na aba Actions

permissions:
  contents: write

# Duas execuções simultâneas (ex.: cron + dispatch manual) commitariam por cima
# uma da outra. Fila em vez de corrida.
concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verifica secrets de e-mail
        id: mail
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD_ANP }}
        run: |
          if [ -n "$MAIL_USERNAME" ] && [ -n "$MAIL_PASSWORD" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets MAIL_USERNAME/MAIL_PASSWORD_ANP ausentes — e-mails não serão enviados."
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Atualiza dados
        run: |
          pip install -r requirements.txt
          python scripts/update_dashboard.py

      - name: Commita se houver mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js
          if git diff --cached --quiet; then
            echo "::notice::data.js sem alteração — nada a commitar."
            exit 0
          fi
          git commit -m "Atualiza dados de vendas (rotina mensal)"
          # Um commit manual entre o checkout e o push derruba o push. Rebase e
          # tenta de novo antes de falhar a rotina inteira por uma corrida.
          for tentativa in 1 2 3; do
            git push && exit 0
            echo "push falhou (tentativa $tentativa); rebase e nova tentativa"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep 5
          done
          echo "::error::não consegui dar push após 3 tentativas"; exit 1

      - name: Extrai resumo para o e-mail
        id: resumo
        run: python scripts/resumo_email.py >> "$GITHUB_OUTPUT"

      - name: Envia e-mail com o dashboard
        if: success() && steps.mail.outputs.ok == 'true'
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD_ANP }}
          subject: "Vendas ANP ${{ steps.resumo.outputs.mes }}: ${{ steps.resumo.outputs.vol }} mil m³ (${{ steps.resumo.outputs.var_yoy }}% a/a) — dashboard atualizado"
          to: jmagomez@gmail.com
          from: "Vendas Líquidos ANP <${{ secrets.MAIL_USERNAME }}>"
          html_body: |
            <h2>Dashboard de vendas de combustíveis líquidos atualizado</h2>
            <p>Último mês <b>consolidado</b> pela ANP: <b>${{ steps.resumo.outputs.mes }}</b>
            (série ${{ steps.resumo.outputs.periodo }}):</p>
            <ul>
              <li>Volume no mês: <b>${{ steps.resumo.outputs.vol }} mil m³</b></li>
              <li>Variação a/a (vs ${{ steps.resumo.outputs.mes_yoy }}): <b>${{ steps.resumo.outputs.var_yoy }}%</b> · vs mês anterior: ${{ steps.resumo.outputs.var }}%</li>
              <li>Líder no mês: <b>${{ steps.resumo.outputs.top_comp }}</b> (${{ steps.resumo.outputs.top_share }}% de participação)</li>
              <li>HHI do mês (por agente regulado): <b>${{ steps.resumo.outputs.hhi }}</b></li>
              ${{ steps.resumo.outputs.mix_li }}
              ${{ steps.resumo.outputs.otto_li }}
            </ul>
            ${{ steps.resumo.outputs.aviso_parcial }}
            <p><a href="https://jmagomez.github.io/vendas-liquidos/">Abrir o dashboard completo</a>
            (vendas mensais com média móvel 12m, variação a/a, mix por combustível e por tipo de
            consumidor, ranking de companhias, concentração e exportação em CSV)</p>
            <p style="color:#888;font-size:12px">Rotina automática (dias 5 e 20) via GitHub Actions · dados abertos da ANP</p>

      - name: Notifica falha por e-mail
        if: failure() && steps.mail.outputs.ok == 'true'
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD_ANP }}
          subject: "⚠️ Rotina do dashboard de vendas ANP falhou (run ${{ github.run_number }})"
          to: jmagomez@gmail.com
          from: "Vendas Líquidos ANP <${{ secrets.MAIL_USERNAME }}>"
          body: |
            A rotina do dashboard de vendas ANP falhou. O data.js NÃO foi alterado
            se a falha veio de uma das travas de integridade (layout do CSV,
            regressão de meses, mês fechado encolhendo).

            Log completo: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
